name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  integration:
    # Builds the image, starts the compose stack, loads recorded data end to end, then smoke-tests
    # the running API container over HTTP.
    needs: unit
    runs-on: ubuntu-latest
    env:
      GEOFUSE_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
      GEOFUSE_ES_INDEX: geofuse-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Build image
        run: docker compose build api
      - name: Start S3, PostGIS and Elasticsearch
        run: docker compose up -d --wait s3 postgis elasticsearch
      - name: End-to-end tests
        run: pytest -q -m integration
      - name: Start API container and smoke-test it
        run: |
          docker compose up -d --wait api
          bash scripts/smoke.sh http://localhost:8000
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - name: Save image for the publish job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "$GEOFUSE_IMAGE" | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: image
          path: image.tar.gz
          retention-days: 1

  publish:
    # Continuous delivery: only an image that passed the integration job is pushed to GHCR.
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
      - run: gunzip -c image.tar.gz | docker load
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
