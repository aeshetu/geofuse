[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geofuse"
version = "0.1.0"
description = "Multi-source geospatial ETL: REST API, ArcGIS FeatureServer, OGC WFS and S3 into PostGIS + Elasticsearch, served as a GeoJSON API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "boto3>=1.34",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "elasticsearch>=8.13,<9",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "moto[s3,server]>=5.0", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
geofuse = "geofuse.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geofuse = ["schema.sql", "es_mapping.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: needs PostGIS, Elasticsearch and an S3 endpoint (run in CI via docker compose)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
